version: '3.8'

services:
  # 1. PostgreSQL databáza
  postgres:
    image: postgres:15
    container_name: iot_postgres
    environment:
      POSTGRES_DB: iot_db
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. MongoDB databáza (spĺňa podmienku verzie 6+)
  mongodb:
    image: mongo:6.0
    container_name: iot_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # 3. Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto
    ports:
      - "1883:1883" # Štandardný port pre MQTT komunikáciu
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

# Pomenované zväzky (volumes) zabezpečia, že sa nám dáta nevymažú pri reštarte
volumes:
  postgres_data:
  mongodb_data: